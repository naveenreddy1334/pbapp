<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Photo Booth</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <button id="btn-settings" class="gear-btn" title="Settings">&#9881;</button>
  <div id="operator-unlock-zone" class="operator-unlock-zone" title=""></div>

  <section id="screen-camera" class="screen active">
    <header class="booth-header">
      <div class="booth-logo"><span>THE</span><strong>PHOTO<br />BOOTH</strong><i>★</i></div>
      <div class="retro-title">RETRO PHOTOBOOTH</div>
      <div class="camera-sign">SMILE! YOU'RE ON CAMERA</div>
    </header>

    <div class="camera-intro">
      <svg class="crown" viewBox="0 0 96 62" aria-hidden="true" focusable="false">
        <path class="crown-body" d="M14 12 29 29 48 6l19 23 15-17-7 34H21z" />
        <path class="crown-band" d="M21 46h58l-2 7H19z" />
        <circle cx="14" cy="12" r="4" />
        <circle cx="48" cy="6" r="4" />
        <circle cx="82" cy="12" r="4" />
      </svg>
      <svg class="intro-arrow" viewBox="0 0 82 64" aria-hidden="true" focusable="false">
        <path d="M11 50c8-4 3-25 14-34 9-8 20 1 15 12-5 13-18 20-28 21 13 4 28 5 42 4" />
        <path d="m48 45 8 8-10 7" />
      </svg>
      <div class="intro-dashes" aria-hidden="true"><i></i><i></i></div>
      <h1>STRIKE A POSE</h1>
      <svg class="intro-smiley" viewBox="0 0 58 58" aria-hidden="true" focusable="false">
        <circle cx="29" cy="29" r="21" />
        <circle class="eye" cx="21" cy="24" r="2" />
        <circle class="eye" cx="37" cy="24" r="2" />
        <path d="M19 33c5 8 15 8 20 0" />
      </svg>
    </div>

    <div class="booth-layout">
      <div class="left-decoration" aria-hidden="true">
        <div class="starburst">✦</div>
        <div class="stripe-stack"><b></b><b></b><b></b><b></b><b></b></div>
        <strong>EST.<br />1964</strong>
        <em></em>
      </div>
      <div class="preview-frame">
        <div class="preview-corner top-left"></div><div class="preview-corner top-right"></div>
        <img id="dslr-live" class="hidden" alt="" />
        <video id="video" autoplay playsinline muted></video>
        <div class="preview-label">LIVE PREVIEW</div>
        <div class="preview-light"></div>
      </div>
      <div class="right-decoration" aria-hidden="true">
        <div class="right-star">✦</div>
        <div class="ticket"><span class="ticket-hole"></span><strong>SMILE</strong><i>★</i><small>GOOD<br />TIMES</small><span class="ticket-hole bottom"></span></div>
      </div>
    </div>
    <div id="dslr-status" class="dslr-status hidden">DSLR Mode &mdash; ready</div>
    <button id="btn-take" class="btn primary big">
      <svg class="camera-icon" viewBox="0 0 32 24" aria-hidden="true" focusable="false">
        <path d="M8 5.5h4l1.8-3h4.4l1.8 3H24a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3v-10a3 3 0 0 1 3-3Z" />
        <circle cx="16" cy="13.5" r="5" />
        <circle class="camera-icon-dot" cx="24" cy="9" r="1" />
      </svg>
      TAKE PHOTO
    </button>
  </section>

  <div id="disconnect-overlay" class="overlay hidden">
    <div class="countdown-label">Camera Disconnected</div>
    <p class="dim-text">Check the connection and try again.</p>
    <button id="btn-reconnect" class="btn primary">Reconnect Camera</button>
  </div>

  <div id="countdown-overlay" class="overlay hidden">
    <div class="countdown-label" id="countdown-label-text">GET READY!</div>
    <div id="countdown-number" class="countdown-number">5</div>
  </div>

  <section id="screen-preview" class="screen">
    <canvas id="preview-canvas"></canvas>
    <div class="copies-row">
      <span class="copies-label">COPIES</span>
      <button id="btn-minus" class="btn round">-</button>
      <span id="copies-count">1</span>
      <button id="btn-plus" class="btn round">+</button>
    </div>
    <div class="controls">
      <button id="btn-cancel" class="btn secondary">CANCEL</button>
      <button id="btn-share" class="btn secondary">SHARE</button>
      <button id="btn-print" class="btn primary">PRINT</button>
    </div>
  </section>

  <section id="screen-printing" class="screen">
    <div id="printing-status" class="printing-status">Printing...</div>
    <div class="controls">
      <button id="btn-print-retry" class="btn primary hidden">RETRY PRINT</button>
      <button id="btn-print-done" class="btn secondary hidden">DONE</button>
    </div>
  </section>

  <div id="share-modal" class="overlay hidden">
    <div class="share-card">
      <h2>Scan to Download</h2>
      <img id="share-qr" alt="QR code" />
      <p id="share-url" class="dim-text"></p>
      <button id="btn-share-close" class="btn secondary">Close</button>
    </div>
  </div>

  <div id="error-toast" class="error-toast hidden">
    <span id="error-toast-text"></span>
    <button id="error-toast-close">&times;</button>
  </div>

  <canvas id="capture-canvas" style="display:none;"></canvas>

  <script src="compositor.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
